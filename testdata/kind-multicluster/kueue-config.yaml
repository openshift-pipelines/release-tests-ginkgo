apiVersion: v1
kind: ConfigMap
metadata:
  name: kueue-manager-config
  namespace: kueue-system
data:
  controller_manager_config.yaml: |
    apiVersion: config.kueue.x-k8s.io/v1beta2
    kind: Configuration
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8443
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    integrations:
      # v0.16.1 defaults an empty list to batch/job; make that contract explicit.
      frameworks: ["batch/job"]
      externalFrameworks:
        - PipelineRun.v1.tekton.dev
    multiKueue:
      externalFrameworks:
        - name: PipelineRun.v1.tekton.dev
    featureGates:
      MultiKueueAdaptersForCustomJobs: true

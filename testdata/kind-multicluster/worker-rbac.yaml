apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-worker
  namespace: release-multicluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: release-worker-observer
rules:
  # Stock Kueue also registers its built-in Job adapter's remote watch.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: release-worker-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: release-worker-observer
subjects:
  - kind: ServiceAccount
    name: release-worker
    namespace: release-multicluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-worker
  namespace: release-multicluster
rules:
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads", "workloads/status"]
    verbs: ["create", "delete", "get", "list", "watch", "patch", "update"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "pipelineruns/status"]
    verbs: ["create", "delete", "get", "list", "watch", "patch", "update"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-worker
  namespace: release-multicluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-worker
subjects:
  - kind: ServiceAccount
    name: release-worker
    namespace: release-multicluster

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - operator.yaml
  - cert-manager.yaml
  - kueue.yaml
images:
  - name: quay.io/jetstack/cert-manager-cainjector
    newTag: v1.19.2
    digest: sha256:1a24f9848e7ae83a787187f4e75fdf5e9adf401f44de2f156c09c6fae1bf046e
  - name: quay.io/jetstack/cert-manager-controller
    newTag: v1.19.2
    digest: sha256:d4ffb81a6d89a0e690ee80d07fcdcb6cccb99118010e3eb0808442e506e18ab0
  - name: quay.io/jetstack/cert-manager-webhook
    newTag: v1.19.2
    digest: sha256:2ba4918d1581ed29bd5d68a017244560b353bcaf9932c814a8713887589bda6c
  - name: registry.k8s.io/kueue/kueue
    newTag: v0.16.1
    digest: sha256:87bdbcb7ab69c5364459710b90b329d51b369c17b21d670f6436fe3f6864a78f
patches:
  - target:
      kind: ConfigMap
      name: tekton-config-defaults
      namespace: tekton-operator
    patch: |
      - op: replace
        path: /data/AUTOINSTALL_COMPONENTS
        value: "false"
  - path: kueue-config.yaml
  # Operator v0.80.0 embeds a scheduler digest that is no longer published.
  # Use the image from the scheduler's own v0.3.1 release manifest.
  - target:
      kind: Deployment
      name: tekton-operator
      namespace: tekton-operator
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tekton-operator
        namespace: tekton-operator
      spec:
        template:
          spec:
            containers:
              - name: tekton-operator-lifecycle
                env:
                  - name: IMAGE_SCHEDULER_MANAGER
                    value: quay.io/openshift-pipeline/kueue-rhel9@sha256:15c12da19c678f2d08c4074d17e121907e0bcc00997d5829a9a5f2bd977ae03f
                  - name: IMAGE_SCHEDULER_WEBHOOK
                    value: quay.io/openshift-pipeline/kueue-rhel9@sha256:15c12da19c678f2d08c4074d17e121907e0bcc00997d5829a9a5f2bd977ae03f

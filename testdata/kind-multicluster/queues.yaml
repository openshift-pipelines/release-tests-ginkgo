apiVersion: v1
kind: Namespace
metadata:
  name: release-multicluster
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: release-multicluster
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: release-multicluster
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: release-multicluster
  resourceGroups:
    - coveredResources: ["tekton.dev/pipelineruns"]
      flavors:
        - name: release-multicluster
          resources:
            - name: tekton.dev/pipelineruns
              nominalQuota: 2
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: release-multicluster
  namespace: release-multicluster
spec:
  clusterQueue: release-multicluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: release-multicluster-kueue
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "pipelineruns/status"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: release-multicluster-kueue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: release-multicluster-kueue
subjects:
  - kind: ServiceAccount
    name: kueue-controller-manager
    namespace: kueue-system

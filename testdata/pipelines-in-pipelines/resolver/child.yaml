apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: pip-resolver-child
spec:
  tasks:
    - name: leaf
      taskSpec:
        results:
          - name: source
            type: string
        steps:
          - name: identify
            image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:34880b64c07f28f64d95737f82f891516de9a3b43583f39970f7bf8e4cfa48b7
            env:
              - name: SOURCE
                value: pinned-cluster-pipeline
            script: |
              #!/bin/sh
              set -eu
              printf '%s' "$SOURCE" > "$(results.source.path)"

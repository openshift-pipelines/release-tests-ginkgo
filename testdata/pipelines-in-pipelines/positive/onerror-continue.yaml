apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: pip-parent
spec:
  pipelineSpec:
    tasks:
      - name: child
        onError: continue
        pipelineSpec:
          tasks:
            - name: fail
              taskSpec:
                steps:
                  - name: fail
                    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                    script: |
                      #!/bin/sh
                      exit 7
      - name: after-child
        runAfter: [child]
        taskSpec:
          results:
            - name: continued
          steps:
            - name: mark
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              script: |
                #!/bin/sh
                printf continued-after-child > "$(results.continued.path)"

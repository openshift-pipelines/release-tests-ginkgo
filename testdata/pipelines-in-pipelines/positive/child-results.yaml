apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: pip-child
spec:
  tasks:
    - name: producer
      taskSpec:
        results:
          - name: observed
            type: string
        steps:
          - name: produce
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/sh
              set -eu
              printf '%s' 'child-produced value' > "$(results.observed.path)"
    - name: consumer
      params:
        - name: message
          value: $(tasks.producer.results.observed)
      taskSpec:
        params:
          - name: message
            type: string
            default: unresolved-fallback
        results:
          - name: observed
            type: string
        steps:
          - name: consume
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: MESSAGE
                value: $(params.message)
            script: |
              #!/bin/sh
              set -eu
              test "$MESSAGE" = 'child-produced value'
              printf '%s' "$MESSAGE" > "$(results.observed.path)"
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: pip-parent
spec:
  pipelineSpec:
    tasks:
      - name: child
        pipelineRef:
          name: pip-child
